server:
  port: 8083

spring:
  cloud:
    openfeign:
      client:
        config:
          # institution-service, slot-service 공통 (기본값은 연결 10초, 응답 60초)
          # 의뢰 생성은 DB 커넥션을 잡은 채 세 번 차례로 호출하므로, 상대가 멈췄을 때 커넥션 풀이 바닥나지 않게 짧게 끊는다
          default:
            connectTimeout: 1000
            readTimeout: 2000
  application:
    name: referral-service
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_PORT:5432}/referral_db
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${JPA_SHOW_SQL:false}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000           # 토픽 메타데이터 대기 한도 (기본 60초)
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000   # linger.ms + request.timeout.ms 이상이어야 함
    consumer:
      group-id: referral-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
      observation-enabled: true   # 소비 시 Kafka 헤더의 traceId를 이어받음
    template:
      observation-enabled: true   # 발행 시 traceId를 Kafka 헤더에 실음

itda:
  kafka:
    slot-results:
      # slot-results 동시 처리 스레드 수. 토픽 파티션 수(3, docker-compose kafka-init)와 같게 둔다
      # 1로 줄이면 예전처럼 스레드 하나가 모든 파티션을 처리한다 (재배포 없이 환경변수로 되돌릴 수 있다)
      concurrency: ${SLOT_RESULTS_CONCURRENCY:3}
  incident-processing:
    scheduler:
      enabled: ${INCIDENT_PROCESSING_SCHEDULER_ENABLED:false}
      fixed-delay-ms: 5000
      initial-delay-ms: 5000
      batch-size: 50
  reschedule-expiration:
    scheduler:
      # 기본 비활성: 기존 데이터 확인 후 명시적으로 활성화
      enabled: ${RESCHEDULE_EXPIRATION_SCHEDULER_ENABLED:false}
      grace-hours: ${RESCHEDULE_EXPIRATION_GRACE_HOURS:48}
      fixed-delay-ms: 3600000
      initial-delay-ms: 60000
      batch-size: 50
  reservation-reconciliation:
    scheduler:
      enabled: ${RESERVATION_RECONCILIATION_SCHEDULER_ENABLED:false}
      fixed-delay-ms: 60000
      batch-size: 200            # 쿼리 3종 × batch-size가 slot-service 조회 한도(1000) 이하여야 한다 (최대 333)
      stale-threshold-minutes: 10
      lookback-hours: 24
      max-attempts: 3            # 일시 오류 시 최초 실행 포함 최대 시도 횟수 (넘으면 수동 확인 대상)

outbox:
  publish:
    # 발행 회차 사이 쉬는 시간. 확정까지 Outbox를 여러 번 거치므로 짧을수록 확정이 빨라진다
    # 문제가 생기면 재배포 없이 환경변수로 되돌린다 (예전 값 1000)
    fixed-delay-ms: ${OUTBOX_PUBLISH_FIXED_DELAY_MS:200}

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  tracing:
    sampling:
      probability: 1.0   # 개발 단계: 모든 요청 샘플링 (운영 시 낮춤)
  endpoints:
    web:
      exposure:
        include: health, prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true   # p95/p99 계산용 bucket 메트릭 노출
        "[reservation.reconciliation.run]": true     # 정합성 점검 회차 전체 소요 시간
        "[reservation.reconciliation.phase]": true   # 정합성 점검 단계별 소요 시간

# 공통 로그 설정 (모든 서비스 동일, 서비스별 상세 레벨은 아래에 추가)
logging:
  include-application-name: true   # 로그에 [서비스명] 출력
  pattern:
    # [traceId-spanId] 뒤에 Kafka 소비 중이면 [eventType eventId] 추가 (이벤트가 없으면 생략)
    correlation: '%correlationId%replace([%X{eventType} %X{eventId}] ){"^\[ \] $", ""}'
  level:
    root: INFO
    healoworld: INFO
    org.apache.kafka: WARN         # Kafka 클라이언트 접속·설정 로그 소음 감소
