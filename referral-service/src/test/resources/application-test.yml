# 테스트 전용 설정 (@ActiveProfiles("test")일 때 main의 application.yml 위에 덮어써진다)
# 접속 계정은 main 설정과 같은 .env 값(POSTGRES_USER/POSTGRES_PASSWORD)을 사용하고, 여기에는 비밀번호를 적지 않는다
# DB 이름은 일부러 변수로 두지 않는다. 연결에 실패해도 개발 DB(referral_db)로 바뀌지 않고 테스트가 실패한다
spring:
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/itda_referral_test
  jpa:
    hibernate:
      # 테이블이 없으면 만들고, 테스트가 끝나도 DROP하지 않는다
      ddl-auto: update
    show-sql: false
  kafka:
    listener:
      # 테스트에서는 Kafka 리스너를 자동 시작하지 않는다 (브로커 없이 localhost:9092 연결을 시도하지 않게)
      # 실제 Kafka가 필요한 테스트는 spring.kafka.listener.auto-startup=true로 켠다 (SlotResultKafkaFlowIntegrationTest)
      auto-startup: false

# 테스트에서는 Eureka 서버에 등록·조회하지 않는다
eureka:
  client:
    enabled: false

itda:
  incident-processing:
    scheduler:
      enabled: false