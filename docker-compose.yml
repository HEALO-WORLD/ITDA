# 컨테이너 로그 크기 제한: 기본(json-file)은 제한 없이 쌓여 디스크를 채운다
# 컨테이너당 10MB × 3개까지만 보관하고 오래된 것부터 지운다
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:18
    container_name: itda-postgres
    logging: *default-logging
    # PostgreSQL이 PID 1이면 부모를 잃은 프로세스(헬스체크 타임아웃으로 남은 pg_isready 등)를 떠안는다.
    # 그 프로세스가 0이 아닌 코드로 끝나면 백엔드가 죽은 것으로 보고 DB 전체를 재시작한다.
    # init(tini)을 PID 1로 두어 이런 프로세스는 tini가 정리하게 한다
    init: true
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  redis:
    image: redis:8.10.3
    container_name: itda-redis
    logging: *default-logging
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.4.0
    container_name: itda-kafka
    logging: *default-logging
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      CLUSTER_ID: F_nIb0DZS3OqEk1rCk7XjQ
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: unless-stopped

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    container_name: itda-kafka-ui
    logging: *default-logging
    ports:
      - "127.0.0.1:8989:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: itda
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:4.4.0
    container_name: itda-kafka-init
    logging: *default-logging
    depends_on:
      - kafka
    entrypoint: [ "/bin/bash", "-c" ]
    command:
      - |
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list > /dev/null 2>&1; do
          echo "Kafka 대기 중..."
          sleep 2
        done
        for topic in slot-commands slot-results equipment-events equipment-availability \
                     slot-commands-dlt slot-results-dlt equipment-events-dlt equipment-availability-dlt; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 \
            --create --if-not-exists --topic "$$topic" \
            --partitions 3 --replication-factor 1
        done
        echo "토픽 생성 완료"

  prometheus:
    image: prom/prometheus:v3.15.1
    container_name: itda-prometheus
    logging: *default-logging
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.4
    container_name: itda-grafana
    logging: *default-logging
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  grafana-data:
  kafka-data: