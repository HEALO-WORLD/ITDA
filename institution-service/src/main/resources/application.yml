server:
  port: 8081

spring:
  application:
    name: institution-service
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/institution_db
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: ${SEED_ENABLED:never}
      data-locations: classpath:seed/local-seed.sql
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: institution-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  tracing:
    sampling:
      probability: 1.0   # 개발 단계: 모든 요청 샘플링 (운영 시 낮춤)
  endpoints:
    web:
      exposure:
        include: health, prometheus
  metrics:
    tags:
      application: ${spring.application.name}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 1h
  dev-token:
    enabled: ${DEV_TOKEN_ENABLED:false}

# 공통 로그 설정 (모든 서비스 동일, 서비스별 상세 레벨은 아래에 추가)
logging:
  include-application-name: true   # 로그에 [서비스명] 출력
  level:
    root: INFO
    healoworld: INFO
    org.apache.kafka: WARN         # Kafka 클라이언트 접속·설정 로그 소음 감소
