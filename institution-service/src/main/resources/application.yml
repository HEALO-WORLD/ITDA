server:
  port: 8081

spring:
  application:
    name: institution-service
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_PORT:5432}/institution_db
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${JPA_SHOW_SQL:false}
    defer-datasource-initialization: true
  sql:
    init:
      mode: ${SEED_ENABLED:never}
      data-locations: classpath:seed/local-seed.sql
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: institution-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
      observation-enabled: true   # 소비 시 Kafka 헤더의 traceId를 이어받음
    template:
      observation-enabled: true   # 발행 시 traceId를 Kafka 헤더에 실음

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  tracing:
    sampling:
      probability: 1.0   # 개발 단계: 모든 요청 샘플링 (운영 시 낮춤)
  endpoints:
    web:
      exposure:
        include: health, prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true   # p95/p99 계산용 bucket 메트릭 노출

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 1h
  dev-token:
    enabled: ${DEV_TOKEN_ENABLED:false}

# 공통 로그 설정 (모든 서비스 동일, 서비스별 상세 레벨은 아래에 추가)
logging:
  include-application-name: true   # 로그에 [서비스명] 출력
  pattern:
    # [traceId-spanId] 뒤에 Kafka 소비 중이면 [eventType eventId] 추가 (이벤트가 없으면 생략)
    correlation: '%correlationId%replace([%X{eventType} %X{eventId}] ){"^\[ \] $", ""}'
  level:
    root: INFO
    healoworld: INFO
    org.apache.kafka: WARN         # Kafka 클라이언트 접속·설정 로그 소음 감소
