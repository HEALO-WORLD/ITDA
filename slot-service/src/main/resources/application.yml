server:
  port: 8082

spring:
  application:
    name: slot-service
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/slot_db
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000           # 토픽 메타데이터 대기 한도 (기본 60초)
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000   # linger.ms + request.timeout.ms 이상이어야 함
    consumer:
      group-id: slot-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
      observation-enabled: true   # 소비 시 Kafka 헤더의 traceId를 이어받음
    template:
      observation-enabled: true   # 발행 시 traceId를 Kafka 헤더에 실음

outbox:
  publish:
    fixed-delay-ms: 1000

hold-expiry:
  fixed-delay-ms: 10000   # HOLD 만료 스캔 간격 (회차 종료 후 대기)

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  tracing:
    sampling:
      probability: 1.0   # 개발 단계: 모든 요청 샘플링 (운영 시 낮춤)
  endpoints:
    web:
      exposure:
        include: health, prometheus
  metrics:
    tags:
      application: ${spring.application.name}

# 공통 로그 설정 (모든 서비스 동일, 서비스별 상세 레벨은 아래에 추가)
logging:
  include-application-name: true   # 로그에 [서비스명] 출력
  pattern:
    # [traceId-spanId] 뒤에 Kafka 소비 중이면 [eventType eventId] 추가 (이벤트가 없으면 생략)
    correlation: '%correlationId%replace([%X{eventType} %X{eventId}] ){"^\[ \] $", ""}'
  level:
    root: INFO
    healoworld: INFO
    org.apache.kafka: WARN         # Kafka 클라이언트 접속·설정 로그 소음 감소
    healoworld.slot_service.global.outbox: debug
    healoworld.slot_service.presentation.consumer: debug
