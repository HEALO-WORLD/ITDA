# main에 merge되면 EC2에 자동 배포한다
# 22번 포트를 쓰지 않고 AWS SSM Run Command로 서버에서 scripts/deploy.sh를 실행한다
# 필요한 Secrets: AWS_DEPLOY_ROLE_ARN, EC2_INSTANCE_ID (설정 방법: docs/cd-github-deploy-role.md)
name: Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # Actions 탭에서 수동 재배포 (main 브랜치에서만 AWS 인증이 통과한다)
    inputs:
      services:
        description: '배포할 서비스 (공백 구분). 비우면 바뀐 서비스만, all이면 전체'
        required: false
        default: ''

permissions:
  id-token: write   # AWS OIDC 인증
  contents: read

# 배포 도중 다음 배포가 끼어들지 않게 순서대로 실행한다 (진행 중인 배포는 취소하지 않음)
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: EC2 배포
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: 배포 명령 실행
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          SERVICES: ${{ inputs.services }}
        run: |
          # 입력값이 서버 셸 명령에 들어가므로 서비스 이름 형식만 허용한다
          if [ -n "$SERVICES" ] && ! [[ "$SERVICES" =~ ^[a-z\ -]+$ ]]; then
            echo "서비스 이름 형식이 잘못됐습니다: $SERVICES"
            exit 1
          fi

          # pull 전 커밋을 기록해 두고, pull한 뒤 배포 스크립트에 넘긴다
          # (스크립트가 실행 중에 자기 자신을 pull로 바꾸지 않도록 pull은 스크립트 밖에서 한다)
          COMMANDS=$(cat <<'EOF'
          set -e
          OLD=$(sudo -iu ec2-user git -C /home/ec2-user/itda rev-parse HEAD)
          sudo -iu ec2-user git -C /home/ec2-user/itda pull --ff-only origin main
          sudo -iu ec2-user bash /home/ec2-user/itda/scripts/deploy.sh "$OLD" __SERVICES__
          EOF
          )
          COMMANDS=${COMMANDS/__SERVICES__/$SERVICES}
          PARAMS=$(jq -n --arg c "$COMMANDS" '{commands: [$c], executionTimeout: ["3600"]}')

          CID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::7}" \
            --parameters "$PARAMS" \
            --query Command.CommandId --output text)
          echo "SSM 명령 ID: $CID"

          # 결과 대기 (최대 30분). aws ssm wait는 100초에서 끝나 이미지 빌드 시간을 기다리지 못한다
          STATUS=Pending
          for _ in $(seq 1 180); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
          done

          echo "::group::서버 출력"
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text
          echo "::endgroup::"

          echo "결과: $STATUS"
          [ "$STATUS" = Success ]
