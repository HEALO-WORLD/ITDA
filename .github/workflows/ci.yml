# PR마다 바뀐 서비스만 빌드·테스트한다
# 브랜치 보호의 필수 체크는 서비스별 job이 아니라 마지막 "CI 결과" job 하나로 지정한다
# (경로 필터로 건너뛴 서비스 job은 체크가 생기지 않아 필수로 지정할 수 없기 때문)
name: CI

on:
  pull_request:
    branches: [ dev, main ]
  workflow_dispatch:   # Actions 탭에서 수동 실행하면 전체 서비스를 빌드한다

permissions:
  contents: read
  pull-requests: read   # 경로 필터가 PR의 변경 파일 목록을 조회한다

# 같은 PR에 새 커밋이 올라오면 이전 실행을 취소한다
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: 변경된 서비스 확인
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.result.outputs.services }}
    steps:
      - uses: actions/checkout@v5

      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          # 워크플로 파일이 바뀌면 전체 서비스를 빌드한다
          filters: |
            eureka-server:
              - &ci '.github/workflows/ci.yml'
              - 'eureka-server/**'
            gateway-service:
              - *ci
              - 'gateway-service/**'
            institution-service:
              - *ci
              - 'institution-service/**'
            referral-service:
              - *ci
              - 'referral-service/**'
            slot-service:
              - *ci
              - 'slot-service/**'

      - id: result
        env:
          CHANGED: ${{ steps.filter.outputs.changes }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "services=${CHANGED:-[]}" >> "$GITHUB_OUTPUT"
          else
            echo 'services=["eureka-server","gateway-service","institution-service","referral-service","slot-service"]' >> "$GITHUB_OUTPUT"
          fi

  build:
    name: 빌드 (${{ matrix.service }})
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false   # 한 서비스가 실패해도 나머지 결과를 끝까지 본다
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Gradle 의존성 캐시 + gradle-wrapper.jar 검증
      - uses: gradle/actions/setup-gradle@v5

      # 테스트 DB는 Testcontainers가 러너의 Docker로 띄운다
      - name: 빌드 및 테스트
        run: ./gradlew build --no-daemon

      - name: 테스트 리포트 업로드 (실패 시)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.service }}
          path: ${{ matrix.service }}/build/reports/tests/test
          retention-days: 7

  result:
    name: CI 결과
    needs: [ changes, build ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 결과 확인
        run: |
          echo "변경 확인: ${{ needs.changes.result }}, 빌드: ${{ needs.build.result }}"
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "변경된 서비스 확인에 실패했습니다"; exit 1
          fi
          # 빌드할 서비스가 없으면 build job은 skipped이고, 이 경우도 통과로 본다
          if [ "${{ needs.build.result }}" = "failure" ] || [ "${{ needs.build.result }}" = "cancelled" ]; then
            echo "빌드 또는 테스트가 실패했습니다"; exit 1
          fi
          echo "통과"
