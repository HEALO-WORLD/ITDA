server:
  port: 8080

spring:
  application:
    name: gateway-service
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  cloud:
    loadbalancer:
      cache:
        ttl: 5s
    gateway:
      server:
        webflux:
          routes:
            - id: block-internal
              uri: no://op
              predicates:
                - Path=/internal/**,/api/v1/internal/**,/api/v1/*/internal/**
              filters:
                - SetStatus=404

            - id: institution-service
              uri: lb://institution-service
              predicates:
                - Path=/api/v1/auth/**,/api/v1/users/**,/api/v1/institutions/**,/api/v1/partnerships/**,/api/v1/equipments/**,/api/v1/exam-types/**

            - id: slot-service
              uri: lb://slot-service
              predicates:
                - Path=/api/v1/slots/**,/api/v1/equipment-downtimes/**

            - id: referral-service
              uri: lb://referral-service
              predicates:
                - Path=/api/v1/referrals/**,/api/v1/equipment-incidents/**,/api/v1/notifications/**,/api/v1/examinations/**

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    registry-fetch-interval-seconds: 5

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  metrics:
    tags:
      application: ${spring.application.name}

jwt:
  secret: ${JWT_SECRET}
  public-paths:
    - /api/v1/auth/signup
    - /api/v1/auth/login
    - /api/v1/institutions/public