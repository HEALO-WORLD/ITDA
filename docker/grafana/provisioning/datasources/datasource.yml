apiVersion: 1
# 예전 볼륨의 Prometheus 데이터소스는 uid가 자동 생성돼 있어, 지우고 고정 uid(prometheus)로 다시 만든다
# (지우지 않으면 같은 이름·다른 uid라 "data source not found"로 Grafana가 시작하지 못한다)
deleteDatasources:
  - name: Prometheus
    orgId: 1
datasources:
  - name: Prometheus
    uid: prometheus   # 경고 규칙(alerting/rules.yml)이 datasourceUid로 참조한다
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
