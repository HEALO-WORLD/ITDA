# 기본 알림 정책: 모든 경고를 Slack으로 보낸다
# 같은 경고·같은 서비스는 한 메시지로 묶고, 해결되지 않은 경고는 repeat_interval마다만 다시 보낸다
apiVersion: 1

policies:
  - orgId: 1
    receiver: slack
    group_by: ['grafana_folder', 'alertname', 'application']
    group_wait: 30s       # 처음 발생 후 같은 묶음의 경고를 모으는 시간
    group_interval: 5m    # 묶음에 새 경고가 더해졌을 때 다시 보내기까지의 간격
    repeat_interval: 4h   # 계속 발생 중인 경고를 다시 알리는 간격
