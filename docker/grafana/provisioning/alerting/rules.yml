# ITDA 경고 규칙 (조건 값은 시작 기준이며 부하 테스트·운영 결과를 보고 조정한다)
# 구조: A = Prometheus 즉시 조회, B = A에 대한 임계값(threshold) 식. 조회 결과의 시계열마다 경고 인스턴스가 생긴다
# 대시보드 링크(__dashboardUid__·__panelId__)는 ITDA 서비스 대시보드에 해당 패널이 있는 규칙에만 단다
# 현재 값(value)은 NoData일 때 A 결과가 없으므로 with로 감싸 '-'로 표시한다
# 주의: Grafana가 provisioning 파일 안의 $NAME을 환경 변수로 치환하므로 $labels·$values·$A 대신 .Labels·.Values와 threshold 식만 쓴다
apiVersion: 1

groups:
  - orgId: 1
    name: itda-alerts
    folder: ITDA
    interval: 1m
    rules:
      # 수집 대상이 응답하지 않음. Prometheus 자체가 데이터를 주지 않으면(NoData)도 경고로 본다
      - uid: itda-service-down
        title: 서비스 다운
        condition: B
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              range: false
              expr: |-
                  up
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
        for: 1m
        noDataState: Alerting
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: Prometheus가 1분 이상 수집하지 못함 (up == 0)
          value: '{{ with .Values.A }}{{ printf "%.0f" .Value }}{{ else }}-{{ end }}'
          __dashboardUid__: itda-services
          __panelId__: '2'
        isPaused: false

      # 요청이 거의 없을 때 1~2건 실패로 비율이 튀지 않도록 초당 0.1건 초과인 서비스만 본다
      - uid: itda-http-5xx-ratio
        title: 5xx 오류 비율 증가
        condition: B
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              range: false
              expr: |-
                  sum by (application) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
                    / sum by (application) (rate(http_server_requests_seconds_count[5m]))
                  and on (application) sum by (application) (rate(http_server_requests_seconds_count[5m])) > 0.1
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.05] }
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: 5분간 5xx 비율 5% 초과 (초당 요청 0.1건 이하 구간은 제외)
          value: '{{ with .Values.A }}{{ humanizePercentage .Value }}{{ else }}-{{ end }}'
          __dashboardUid__: itda-services
          __panelId__: '6'
        isPaused: false

      - uid: itda-http-p95-latency
        title: 응답 지연
        condition: B
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              range: false
              expr: |-
                  histogram_quantile(0.95, sum by (application, le) (rate(http_server_requests_seconds_bucket{uri!~"/actuator.*"}[5m])))
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [1] }
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: 5분간 p95 응답 시간 1초 초과 (actuator 제외)
          value: '{{ with .Values.A }}{{ humanizeDuration .Value }}{{ else }}-{{ end }}'
          __dashboardUid__: itda-services
          __panelId__: '10'
        isPaused: false

      # observation-enabled라 실패는 result 태그가 아니라 error 태그(none이 아닌 값)로 구분한다 (대시보드와 같은 기준)
      - uid: itda-kafka-listener-failure
        title: Kafka 처리 실패
        condition: B
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              range: false
              expr: |-
                  sum by (application) (increase(spring_kafka_listener_seconds_count{error!~"none|"}[5m]))
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: 5분간 Kafka 리스너 처리 실패 발생 (재시도 포함 횟수)
          value: '{{ with .Values.A }}{{ printf "%.0f" .Value }}회{{ else }}-{{ end }}'
          __dashboardUid__: itda-services
          __panelId__: '14'
        isPaused: false

      # 처리되지 않은 DLT 메시지가 남아 있는 동안 경고를 유지한다. 관리자 API로 재처리·무시해 0이 되면 복구된다
      # (적재 순간만 보는 increase() 방식은 5분 뒤 처리 여부와 무관하게 복구로 떠서 쓰지 않는다)
      - uid: itda-dead-letter-pending
        title: DLT 미처리 메시지
        condition: B
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              range: false
              expr: |-
                  max by (application) (dead_letter_pending)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: 처리되지 않은 DLT 메시지가 있음 (관리자 API로 재처리·무시하면 복구)
          value: '{{ with .Values.A }}{{ printf "%.0f" .Value }}건 미처리{{ else }}-{{ end }}'
        isPaused: false

      # 정합성 점검 주기보다 넉넉하게 10분 구간을 본다
      - uid: itda-reconciliation-manual-review
        title: 정합성 수동 확인 발생
        condition: B
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              range: false
              expr: |-
                  sum by (application) (increase(reservation_reconciliation_recovery_total{outcome="manual_review"}[10m]))
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: 정합성 점검이 예약을 수동 확인 대상으로 기록 (자동 재시도 중단)
          value: '{{ with .Values.A }}{{ printf "%.0f" .Value }}건{{ else }}-{{ end }}'
        isPaused: false
